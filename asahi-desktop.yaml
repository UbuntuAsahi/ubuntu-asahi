name: ubuntu-asahi-desktop
display-name: Ubuntu Asahi Preinstalled Desktop
revision: 0
architecture: arm64
series: resolute
class: preinstalled
kernel: linux-asahi-arm
gadget:
  url: "https://git.launchpad.net/~canonical-foundations/snap-pc/+git/github-mirror-amd64"
  branch: classic
  type: "git"
rootfs:
  archive: ubuntu
  components:
    - main
    - restricted
    - universe
    - multiverse
  mirror: "http://archive.ubuntu.com/ubuntu/"
  sources-list-deb822: true
  pocket: updates
  seed:
    urls:
      - "https://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/"
    branch: questing
    names:
      - desktop
      - desktop-minimal
      - desktop-minimal-default-languages
      - minimal
      - standard
customization:
  pocket: updates
  extra-snaps:
    - name: snapd
    - name: core24
    - name: gnome-46-2404
      channel: stable/ubuntu-26.04
    - name: gtk-common-themes
      channel: stable/ubuntu-26.04
    - name: mesa-2404
      channel: stable/ubuntu-26.04
    - name: firefox
      channel: stable/ubuntu-26.04
    - name: snap-store
      channel: stable/ubuntu-26.04
    - name: snapd-desktop-integration
      channel: stable/ubuntu-26.04
  extra-packages:
    - name: ubuntu-asahi
    - name: language-pack-de-base
    - name: language-pack-en-base
    - name: language-pack-es-base
    - name: language-pack-fr-base
    - name: language-pack-pt-base
    - name: language-pack-it-base
    - name: language-pack-ru-base
    - name: language-pack-zh-hans-base
    - name: language-pack-zh-hant-base
  extra-ppas:
    - name: ubuntu-asahi/ubuntu-asahi
      keep-enabled: no
  cloud-init:
    user-data: |
      #cloud-config
      users: []
artifacts:
  rootfs-tarball:
    name: ubuntu-26.04-preinstalled-desktop-arm64+asahi.tar.gz
    compression: gzip
  manifest:
    name: ubuntu-26.04-preinstalled-desktop-arm64+asahi.manifest
